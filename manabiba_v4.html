<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>まなびば</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6FAF8; --ink:#3D4B54; --ink-soft:#71858C; --line:#DDE9E4;
  --mint:#5FB597; --mint-soft:#E3F3EC;
  --blue:#7FAAD6; --blue-soft:#E9F1F9;
  --pink:#E799AC; --pink-soft:#FBECF0; --pink-deep:#C96F87;
  --red:#DD7A6C; --red-soft:#FBEDEA;
  --pome:#B98A5A; --pome-soft:#F6F0E7;
  --disp:'Zen Maru Gothic',sans-serif; --body:'Noto Sans JP',sans-serif;
  --bar-h:58px; --tab-h:68px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* 上のバー:戻るボタンはいつも左上 */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--bar-h);background:#fff;border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:20}
.topbar .back{width:52px;height:46px;border-radius:12px;font-size:24px;font-weight:700}
.topbar .back:active{background:var(--paper)}
.topbar h1{flex:1;text-align:center;font-family:var(--disp);font-weight:900;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .mode{min-width:52px;height:42px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line);font-family:var(--disp);font-weight:700;font-size:13px;white-space:nowrap}
body.parent .topbar{background:var(--pink-soft);border-color:var(--pink)}
body.parent .topbar .mode{background:var(--ink);color:#fff;border-color:var(--ink)}

main{padding:calc(var(--bar-h) + 16px) 16px calc(var(--tab-h) + 28px);max-width:820px;margin:0 auto}
body.parent main{padding-bottom:40px}

/* 下のボタン:いつも同じ5つ。ポメはいつもここにいる */
.tabbar{position:fixed;bottom:0;left:0;right:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1.5px solid var(--line);display:flex;z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--disp);font-weight:700;font-size:12px;color:var(--ink-soft)}
.tabbar .ic{font-size:26px;line-height:1}
.tabbar button.on{color:var(--ink);background:var(--mint-soft)}
.tabbar button.pome.on{background:var(--pome-soft)}
body.parent .tabbar{display:none}

.screen{display:none}
.screen.on{display:block}
.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.card h2{font-family:var(--disp);font-weight:900;font-size:17px;margin-bottom:8px}
.card.soon{border-style:dashed;background:var(--paper)}
.card.soon h2{color:var(--ink-soft)}
.note{font-size:13px;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:14px;background:var(--ink);color:#fff;font-family:var(--disp);font-weight:700;font-size:15px;text-decoration:none}
.btn.sub{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn[disabled]{opacity:.4;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.tag.mint{background:var(--mint-soft);border-color:var(--mint)}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.list-row .grow{flex:1;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--ink-soft)}
.kv dd{font-weight:700}

/* リンク集:1画面に収まるよう小さめのタイルで並べる */
.link-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.ltile{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-decoration:none;color:inherit;min-height:54px}
.ltile:active{background:var(--paper)}
.ltile img,.ltile .lic{width:34px;height:34px;border-radius:8px;flex-shrink:0}
.ltile img{object-fit:cover;border:1px solid var(--line)}
.ltile .lic{display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--paper)}
.ltile .t{font-size:13px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 教科の切り替え */
.segs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.segs button{padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-family:var(--disp);font-weight:700;font-size:14px}
.segs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* 暗記カードの単元ごとのまとまり */
/* 単元名を左の列、デッキを同じ幅の枠で右に並べて、縦の線をそろえる */
.unit{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line)}
.unit:last-child{border-bottom:none}
.unit h3{font-size:12.5px;font-weight:700;color:var(--ink-soft);padding-top:4px;line-height:1.35}
.chips{display:flex;flex-direction:column;gap:7px}
/* 同じ教材のまとまり(例:〇〇(1)〜(3))ごとに行を分ける。列の幅は全部同じなので縦の線はそろう */
.dgroup{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:5px}
.dchip{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;min-width:0}
.dchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchip small{font-size:11px;color:var(--ink-soft);flex-shrink:0}
@media(max-width:560px){.unit{grid-template-columns:1fr}.unit h3{padding-top:0}}
.dchip.done{background:var(--mint-soft);border-color:var(--mint)}
.dchip.none{color:var(--ink-soft);border-style:dashed}

/* 保護者モード:タイルで並べ、なるべくスクロールさせない */
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.ptile{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;min-height:70px;display:flex;flex-direction:column;justify-content:center}
.ptile b{font-family:var(--disp);font-size:14.5px}
.ptile span{font-size:11.5px;color:var(--ink-soft);line-height:1.4}
.ptile.go{border-color:var(--pome)}
.ptile.go:active{background:var(--pome-soft)}
.ptile.soon{border-style:dashed;background:var(--paper);color:var(--ink-soft);cursor:default}
details.more summary{cursor:pointer;font-size:13px;color:var(--ink-soft);margin-top:6px}

/* デッキをタップしてはじめる */
.dchip.tap{cursor:pointer}
.dchip.tap:active{background:var(--mint-soft)}
.unit h3 .ugo{margin-left:6px;font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:99px;border:1.5px solid var(--mint);background:var(--mint-soft);color:var(--ink)}

/* 暗記カードをやる画面(1画面でやることは1つ。ボタンは大きく) */
.cr-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.cr-top .grow{flex:1;min-width:0;font-size:13px;color:var(--ink-soft)}
.cr-bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:10px}
.cr-bar i{display:block;height:100%;background:var(--mint)}
.cr-opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.cr-opts .segs{margin:0}
.cr-opts .segs button{padding:4px 11px;font-size:12.5px}
.cr-card{background:#fff;border:2px solid var(--line);border-radius:22px;min-height:38vh;padding:22px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;margin-bottom:12px}
.cr-card .q{font-family:var(--disp);font-weight:900;font-size:clamp(26px,6vw,40px);line-height:1.4;word-break:break-word}
.cr-card .a{font-family:var(--disp);font-weight:900;font-size:clamp(28px,6.5vw,44px);color:var(--mint);margin-top:14px;line-height:1.4;word-break:break-word}
.cr-card .exp{margin-top:12px;font-size:14px;color:var(--ink-soft)}
.cr-card .tapmsg{margin-top:16px;font-size:13px;color:var(--ink-soft)}
.cr-card.shown{border-color:var(--mint)}
.cr-card img{max-width:100%;max-height:26vh;border-radius:12px;margin-bottom:10px}
.cr-judge{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cr-judge button{min-height:78px;border-radius:18px;border:2px solid var(--line);background:#fff;font-family:var(--disp);font-weight:900;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.cr-judge button b{font-size:26px;line-height:1}
.cr-judge button small{font-size:11px;font-weight:500;color:var(--ink-soft)}
.cr-judge button:disabled{opacity:.55}
.cr-judge button.tapped{border-color:var(--ink);background:var(--paper)}
.cr-flash{min-height:26px;text-align:center;font-size:14px;margin-top:8px}
.cr-end{text-align:center;padding:10px 0}
.cr-end .big{font-size:56px;line-height:1.2}
.cr-end h2{font-family:var(--disp);font-weight:900;font-size:21px;margin:6px 0}
.cr-end .score{display:flex;gap:16px;justify-content:center;font-size:20px;font-family:var(--disp);font-weight:900;margin:8px 0}
.cr-end .btnrow{justify-content:center;flex-direction:column;align-items:stretch;max-width:420px;margin:12px auto 0}
.sortcard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;text-align:center;margin-bottom:12px}
.sortcard .sq{font-family:var(--disp);font-weight:900;font-size:24px}
.sortcard .sa{margin-top:8px;font-size:18px}
.sortbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sortbtns button{min-height:80px;border-radius:18px;border:2px solid var(--line);background:#fff;font-family:var(--disp);font-weight:900;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sortbtns button small{font-size:11px;font-weight:500;color:var(--ink-soft)}

/* チャット(ポメ・親ポメ):下のボタンの上まで使い、入力欄は画面の下に固定 */
.chat{display:flex;flex-direction:column;height:calc(100vh - var(--bar-h) - var(--tab-h) - 44px)}
body.parent .chat{height:calc(100vh - var(--bar-h) - 44px)}
.chat-head{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.chat-head .grow{flex:1;min-width:0;font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-scroll{flex:1;overflow-y:auto;padding:4px 2px 8px}
.msg{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.msg .pface{font-size:26px;flex-shrink:0}
.bubble{background:#fff;border:1.5px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px;max-width:86%;white-space:pre-wrap;word-break:break-word;font-size:15px}
.msg.me .bubble{background:var(--mint-soft);border-color:var(--mint);border-radius:16px 4px 16px 16px}
.chat-in{display:flex;gap:6px;align-items:flex-end;padding-top:6px}
.chat-in textarea{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:#fff;resize:none;line-height:1.5}
.chat-in .tool{width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:20px;flex-shrink:0}
.chat-in .tool.listening{background:#FDEBEB;border-color:var(--red);animation:micpulse 1s infinite}
.chat-in .send{min-width:64px;height:46px;padding:0 14px;border-radius:14px;background:var(--ink);color:#fff;font-family:var(--disp);font-weight:700;flex-shrink:0}
.chat-in .send.stopping{background:var(--red-soft);color:#A33;border:1.5px solid var(--red)}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(224,110,110,.45)}50%{box-shadow:0 0 0 7px rgba(224,110,110,0)}}
.voice-status{font-size:12px;color:#A33;min-height:16px;margin-top:2px}
.hist-row{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hist-row.on{font-weight:700}
.favstar{font-size:20px;color:var(--line)}
.favstar.on{color:#E8B84B}

/* 小さなウィンドウ(カードの中身を見る・手書き) */
.ov{position:fixed;inset:0;background:rgba(30,30,40,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
.ov.open{display:flex}
.ov-card{background:#fff;border-radius:20px;padding:16px;max-width:760px;width:100%;max-height:88vh;overflow-y:auto;position:relative}
.ov-card h3{font-family:var(--disp);font-size:16px;margin-bottom:8px;padding-right:40px}
.ov-x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:12px;font-size:20px}
#padModal{padding:10px}
#padModal .ov-card{max-width:1200px;height:calc(100vh - 20px);max-height:none;display:flex;flex-direction:column}
#padCanvas{flex:1;min-height:260px;width:100%;border:2px solid var(--line);border-radius:14px;background:#FCFCFA;touch-action:none;display:block}
.pad-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.form-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.form-row label{min-width:64px;font-size:13px;color:var(--ink-soft)}
.form-row input,.form-row select{flex:1;min-width:140px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.tc{font-size:13px;display:grid;grid-template-columns:28px 1fr 1fr;gap:4px 8px;padding:5px 0;border-bottom:1px solid var(--line)}
.ctxbox{white-space:pre-wrap;font-size:12.5px;background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}

.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 18px);transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.boot{text-align:center;padding:60px 0;color:var(--ink-soft);font-family:var(--disp)}

/* 3段階目:日課表 */
.timerbar{position:fixed;top:var(--bar-h);left:0;right:0;z-index:19;display:none;align-items:center;gap:8px;padding:6px 10px;background:var(--mint-soft);border-bottom:1.5px solid var(--mint);font-family:var(--disp);font-weight:700;font-size:14px}
body.hasTimer .timerbar{display:flex}
body.hasTimer main{padding-top:calc(var(--bar-h) + 66px)}
.tb-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-c{font-size:20px;font-variant-numeric:tabular-nums}
.tb-b{min-height:38px;padding:0 12px;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;white-space:nowrap}
.tb-b.sub{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.dayhead b{font-family:var(--disp);font-size:20px;font-weight:900;margin-right:6px}
.dayhead .prog{font-family:var(--disp);font-weight:900;font-size:20px;color:var(--mint)}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;font-weight:700;margin-right:4px;border:1.5px solid var(--line);background:#fff;vertical-align:middle}
.chip.main{background:var(--mint-soft);border-color:var(--mint)}
.chip.warn{background:#FDF6E3;border-color:#E8B84B}
.chip.t-A{background:var(--pink-soft);border-color:var(--pink)}
.chip.t-memo{background:var(--blue-soft);border-color:var(--blue)}
.chip.t-off{background:#eee;color:var(--ink-soft)}
.prows{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:stretch;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:8px 12px 8px 8px}
.prow.next{border-color:var(--mint);background:var(--mint-soft);box-shadow:0 0 0 3px rgba(95,181,151,.25)}
.prow.done{opacity:.55}
.pchk{flex:none;width:56px;min-height:56px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:28px;font-weight:900;color:var(--mint);align-self:center}
.prow.done .pchk{background:var(--mint);border-color:var(--mint);color:#fff}
.exbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:#FDF6E3;border:1.5px solid #E8B84B;border-radius:14px;padding:10px 14px;margin-bottom:10px;font-family:var(--disp);font-weight:900;font-size:15px;text-align:left}
.exbtn span{font-size:13px;font-weight:700;color:var(--ink-soft)}
.exbtn.hot span{color:var(--red)}
.exsubs{display:flex;flex-direction:column;gap:8px}
.exsub{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px 10px 6px 6px}
.exsub .pchk{width:48px;min-height:48px;font-size:24px}
.exsub.done{opacity:.55}.exsub.done .pchk{background:var(--mint);border-color:var(--mint);color:#fff}
.exsb{display:flex;flex-direction:column;gap:2px;min-width:0}
.exsb b{font-size:15px}
.exlab{display:inline-block;min-width:3.2em;font-size:12px;font-weight:700;padding:0 6px;margin-right:6px;border-radius:6px;background:var(--mint-soft);text-align:center}
.exrng{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:start}
.exr{display:contents}
.exta{width:100%;min-height:110px;margin:8px 0;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;font-size:13px;font-family:inherit}
.pmain{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:4px 0}
.pmain b{font-family:var(--disp);font-size:18px;font-weight:900}
.pmain small{font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.prow.done .pmain b{text-decoration:line-through}
.pmin{flex:none;align-self:center;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead .btn{min-height:42px;padding:4px 16px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calw{text-align:center;font-size:12px;color:var(--ink-soft);font-weight:700}
.calc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58px;border-radius:10px;border:1.5px solid var(--line);background:#fff;padding:2px 0;line-height:1.25}
.calc.out{opacity:.35}
.calc.t-A{background:var(--pink-soft);border-color:var(--pink)}
.calc.t-memo{background:var(--blue-soft);border-color:var(--blue)}
.calc.t-off{background:#eee}
.calc.today{box-shadow:0 0 0 2.5px var(--ink)}
.calc .cn{font-size:13px;font-weight:700}
.calc .ck{font-family:var(--disp);font-weight:900;font-size:16px}
.calc .cp{font-size:10px;color:var(--ink-soft);min-height:12px}
.phrow{display:flex;gap:14px;flex-wrap:wrap}
.phrow select{padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:15px}
.wkrow{display:grid;grid-template-columns:64px auto 1fr auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.wkrow.today{background:var(--mint-soft);border-radius:10px}
.wkrow.fut{opacity:.55}
.wmarks{display:flex;gap:4px}
.wm{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-soft)}

<script>
/* ============================================================
   まなびば v4 — 作り直し版(日課表+ワークドリル)
   docs/01_日課表.md・docs/02_ワークドリル.md に沿って作る。
   今のまなびば(manabiba_v3.html)のデータは「読むだけ」で、書き込まない。
   ============================================================ */
"use strict";
const BUILD_ID="2026-11-03c(ワークドリル)";
const qs=s=>document.querySelector(s), qsa=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fmtDateTime=iso=>{if(!iso)return"";const d=new Date(iso);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
let toastTimer=null;
function toast(m){const t=qs("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2600);}
const SUBJECTS=[
 {id:"math",name:"数学"},{id:"eng",name:"英語"},{id:"sci",name:"理科"},
 {id:"geo",name:"地理"},{id:"his",name:"歴史"},{id:"jpn",name:"国語"}];
const subName=id=>(SUBJECTS.find(s=>s.id===id)||{}).name||"";

/* ---------- 保存(IndexedDB) ----------
 * kv     :小さなデータ(暗記カード・リンク・ポメの会話・設定・記録など)をまとめて置く
 * images :暗記カードの写真
 * pages  :ワークのページ写真(ドリルの段階で使う) */
const DB_NAME="manabiba_v4",DB_VER=1;
let _dbP=null;
function dbOpen(){
 if(_dbP)return _dbP;
 _dbP=new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=()=>{const db=r.result;["kv","images","pages"].forEach(n=>{if(!db.objectStoreNames.contains(n))db.createObjectStore(n);});};
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error);});
 return _dbP;}
async function dbTx(store,mode,fn){
 const db=await dbOpen();
 return new Promise((res,rej)=>{
  const tx=db.transaction(store,mode);let out;
  const r=fn(tx.objectStore(store));
  if(r)r.onsuccess=()=>{out=r.result;};
  tx.oncomplete=()=>res(out);
  tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}
const dbGet=(s,k)=>dbTx(s,"readonly",st=>st.get(k));
const dbPut=(s,k,v)=>dbTx(s,"readwrite",st=>st.put(v,k));
const dbClear=s=>dbTx(s,"readwrite",st=>st.clear());
async function dbAll(store){
 const db=await dbOpen();
 return new Promise((res,rej)=>{
  const tx=db.transaction(store,"readonly"),out={};
  const c=tx.objectStore(store).openCursor();
  c.onsuccess=e=>{const cur=e.target.result;if(cur){out[cur.key]=cur.value;cur.continue();}};
  tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);});}

/* 画面で使うデータ。キーごとに保存する(save("cards")のように) */
const KV_DEFAULTS=()=>({
 cards:{decks:[],cardLog:{}},          // 暗記カード(今のまなびばと同じ形のまま)
 links:[],                             // リンク集
 pome:{chats:[],pchats:[]},            // ポメ・親ポメの会話
 settings:{apiKey:"",model:"claude-sonnet-5"},
 drill:{books:{},log:{},skip:{},reports:[],alt:{}}, // ワークドリル(問題の形・○×の記録。写真は pages ストア)
 plan:{anchor:"",days:{},tests:[],phase:[5,5,3],done:{},timer:null}, // 日課表(日の種類・テスト日・チェック・タイマー)
 meta:{}                               // 引き継ぎの記録など
});
let D=KV_DEFAULTS();
async function loadAll(){
 const all=await dbAll("kv"),def=KV_DEFAULTS();
 for(const k of Object.keys(def))D[k]=(k in all)?all[k]:def[k];}
async function save(key){
 try{await dbPut("kv",key,D[key]);}
 catch(e){toast("保存できませんでした:"+e.message);}}

/* ---------- 今のまなびば(v3)からの引き継ぎ ----------
 * 引き継ぐのは「暗記カード」「リンク集」「ポメの会話」と、ポメに必要な設定(APIキー・モデル)だけ。
 * v3のデータ(localStorageの manabiba3、IndexedDBの manabiba_images_db)は読むだけで、変更・削除はしない。 */
const OLD_KEY="manabiba3",OLD_IMG_DB="manabiba_images_db";
const DROP_LINK=/NHK|10min|アクティブ10|レキデリ|ぴよぴーよ|いかを/; // 不要と決めたリンク(NHK・YouTubeチャンネル)
const STASAPU={name:"スタサプ(スタディサプリ中学講座)",url:"https://junior-learn.studysapuri.jp/",subs:[],icon:"📺"};
function readOldState(){try{const j=localStorage.getItem(OLD_KEY);return j?JSON.parse(j):null;}catch(e){return null;}}
/** v3の写真置き場を開く。無ければ作らずにnullを返す(空の置き場を勝手に作らない) */
function openOldImgDb(){
 return new Promise(res=>{
  let r;try{r=indexedDB.open(OLD_IMG_DB);}catch(e){res(null);return;}
  r.onupgradeneeded=()=>{r.transaction.abort();};
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>res(null);});}
async function oldImgGetter(){
 const db=await openOldImgDb();
 if(!db||!db.objectStoreNames.contains("images"))return async()=>null;
 return id=>new Promise(res=>{
  const tx=db.transaction("images","readonly");const r=tx.objectStore("images").get(id);
  r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);});}
const newImgId=()=>"idb:img_"+Date.now()+"_"+Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
/** v3の保存データ(oldS)と写真の取り出し方(getImg)から、新しいまなびばへ写す。結果の報告を返す。 */
async function migrateFrom(oldS,getImg,source){
 const rep={source,at:new Date().toISOString(),decks:0,cards:0,images:0,imagesMissing:0,cardLogDays:0,
  links:0,droppedLinks:[],addedLinks:[],chats:0,pchats:0,apiKey:false};
 // 暗記カード(写真は同じ番号のまま新しい置き場へ写す。古い形式の埋め込み写真は番号を付けて写す)
 const decks=clone(oldS.decks||[]),images={};
 for(const d of decks){
  rep.decks++;
  for(const c of (d.cards||[])){
   rep.cards++;
   for(const f of ["img","imgBack"]){
    const v=c[f];if(!v)continue;
    if(String(v).startsWith("idb:")){const data=await getImg(v);if(data)images[v]=data;else rep.imagesMissing++;}
    else if(String(v).startsWith("data:")){const id=newImgId();images[id]=v;c[f]=id;}}}}
 rep.images=Object.keys(images).length;
 rep.bySub=SUBJECTS.map(s=>({n:s.name,c:decks.filter(d=>d.sub===s.id).length})).filter(x=>x.c).map(x=>x.n+x.c).join("・");
 const cardLog=clone(oldS.cardLog||{});rep.cardLogDays=Object.keys(cardLog).length;
 // リンク集(デジタルドリルと参考情報を1つにまとめる。NHK・YouTubeチャンネルは外し、スタサプを足す)
 const links=[];
 for(const l of (oldS.extLinks||[])){
  if(DROP_LINK.test(l.name||"")){rep.droppedLinks.push(l.name);continue;}
  links.push({id:"l"+links.length+"_"+Date.now().toString(36),name:l.name||"",url:l.url||"",
   subs:Array.isArray(l.subs)?l.subs:[],icon:l.icon||"",thumb:l.thumb||"",note:l.note||""});}
 if(!links.some(l=>/junior-learn\.studysapuri\.jp/.test(l.url||""))){
  links.unshift({id:"l_stasapu",...STASAPU,thumb:"",note:""});rep.addedLinks.push(STASAPU.name);}
 rep.links=links.length;
 // ポメ・親ポメの会話と設定
 const chats=clone(oldS.chats||[]),pchats=clone(oldS.pchats||[]);
 rep.chats=chats.length;rep.pchats=pchats.length;
 const st=oldS.settings||{};
 let model=st.model||"claude-sonnet-5";if(model==="claude-sonnet-4-6")model="claude-sonnet-5";
 rep.apiKey=!!st.apiKey;
 // 書き込み(新しいまなびばの側だけ)
 await dbClear("images");
 for(const [k,v] of Object.entries(images))await dbPut("images",k,v);
 D.cards={decks,cardLog};D.links=links;D.pome={chats,pchats};D.settings={apiKey:st.apiKey||"",model};
 D.meta={...D.meta,migration:rep};
 for(const k of ["cards","links","pome","settings","meta"])await save(k);
 return rep;}
async function migrateFromThisBrowser(){
 const oldS=readOldState();
 if(!oldS)return null;
 return migrateFrom(oldS,await oldImgGetter(),"このブラウザ(このアドレス)に残っていた今のまなびばのデータ");}
async function rerunMigration(){
 if(!readOldState()){toast("このパソコンには今のまなびばのデータが見つかりません");return;}
 if(!confirm("今のまなびばから、もう一度引き継ぎます。\n新しいまなびばの「暗記カード・リンク集・ポメの会話」は、今のまなびばの内容で置き換わります。\nよろしいですか?"))return;
 const rep=await migrateFromThisBrowser();
 toast("引き継ぎました(デッキ"+rep.decks+"・カード"+rep.cards+"枚)");renderCurrent();}
/** v3の「バックアップを保存(JSON)」で作ったファイルから引き継ぐ */
function importOldBackupFile(inp){
 const f=inp.files[0];inp.value="";if(!f)return;
 const r=new FileReader();
 r.onload=async()=>{
  try{
   const j=JSON.parse(r.result);
   const oldS=j.S||j;
   if(!oldS||(!oldS.decks&&!oldS.extLinks&&!oldS.chats))throw new Error("今のまなびばのバックアップではないようです");
   if(!confirm("このファイルから引き継ぎます。\n新しいまなびばの「暗記カード・リンク集・ポメの会話」は、ファイルの内容で置き換わります。\nよろしいですか?"))return;
   const imgs=j.images||{};
   const rep=await migrateFrom(oldS,async id=>imgs[id]||imgs[String(id).replace(/^idb:/,"")]||null,"バックアップファイル("+f.name+")");
   toast("引き継ぎました(デッキ"+rep.decks+"・カード"+rep.cards+"枚)");renderCurrent();
  }catch(e){alert("読み込めませんでした:"+e.message);}};
 r.readAsText(f);}

/* ---------- 新しいまなびばのバックアップ(書き出す・読み込む) ---------- */
async function exportBackup(){
 try{
  const kv={};for(const k of Object.keys(D))kv[k]=D[k];
  const payload={app:"manabiba",version:4,build:BUILD_ID,exportedAt:new Date().toISOString(),
   kv,images:await dbAll("images"),pages:await dbAll("pages")};
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="manabiba_backup_"+today()+".json";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  D.meta={...D.meta,lastBackupAt:new Date().toISOString()};await save("meta");renderCurrent();
  toast("バックアップを書き出しました");
 }catch(e){alert("書き出せませんでした:"+e.message);}}
function importBackupFile(inp){
 const f=inp.files[0];inp.value="";if(!f)return;
 const r=new FileReader();
 r.onload=async()=>{
  try{
   const j=JSON.parse(r.result);

/** Claude APIをストリーミングで呼ぶ。onTextには「ここまでの全文」を都度渡す(差分ではない)。
 * signal(AbortController.signal)で中断できる。中断時は例外を投げず、それまでに生成された文章を返す
 * (呼び出し側が「中断した返答も残す」処理をしやすくするため)。onText/signalは省略可(既存の呼び出し方と互換)。 */
async function callClaude(system,messages,onText,signal){
 const key=D.settings.apiKey;
 if(!key)throw new Error("APIキーが未設定です。おうちメニュー→設定で入力してください。");
 let full="";
 try{
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,
   headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
   body:JSON.stringify({model:D.settings.model||"claude-sonnet-5",max_tokens:1000,system:system,messages:messages,stream:true})});
  if(!res.ok){const t=await res.text();throw new Error("APIエラー "+res.status+": "+t.slice(0,200));}
  const reader=res.body.getReader(),decoder=new TextDecoder();
  let buf="";
  while(true){
   const {done,value}=await reader.read();
   if(done)break;
   buf+=decoder.decode(value,{stream:true});
   const lines=buf.split("\n");buf=lines.pop();
   for(const line of lines){
    if(!line.startsWith("data: "))continue;
    let ev;try{ev=JSON.parse(line.slice(6));}catch(e){continue;}
    if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.type==="text_delta"){
     full+=ev.delta.text;
     if(onText)onText(full);
    }
   }
  }
 }catch(e){
  if(e.name==="AbortError")return full; // 中断:エラーにせず、ここまでの文章を返す
  throw e;
 }
 return full;}

let chatRecog=null,chatRecogGen=0,chatVoiceMode=null,chatRecogNetErr=0;

function startChatRecog(){
 const m=chatVoiceMode;if(!m)return;

 const myGen=++chatRecogGen;

 function startOne(){
  const r=new SR();r.lang="ja-JP";r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
  r.onstart=()=>{if(myGen!==chatRecogGen)return;setChatVoiceUi("listen");};

   if(e.error==="network"&&++chatRecogNetErr>=3){toast("音声入力がつながりません(ネットワーク)。もう一度マイクを押してください");stopChatVoice();}

/* ポメ(香凜さん用)の指示文。今のまなびばと同じ内容(暗記ものはすぐ答え、考える問題はヒントで導く) */
const POME_SYS=`あなたは「ポメ」。中学1年生・香凜(かりん)さんの学習をサポートする犬のキャラクター。

# 対応教科
国語・数学・理科・社会・英語の5教科すべて。どの教科も「担当外」と断らず、同じように付き合う。

# 最優先ルール:質問をA・B・Cに分けてから答える
判断基準:「答えを知っていれば一瞬で済むか?」Yes→A、No→B。

A. 覚えていれば答えられる質問(漢字・英単語・用語・年号・公式・「どっちが正しい?」など)
思い出せないものに遠回りさせると、時間とやる気を失うだけ。すぐ答える。
1. 最初の1文で答えをはっきり言う
2. 覚え方のコツを一言(語呂合わせ・似たものとの違い・由来など)
3. 「じゃあこれは?」と確認問題を1問だけ出す

B. 考えれば解ける質問(計算・文章題・理由の説明・資料の読み取り・作文など)
自分で考えることで力がつく。問題の答え(数値・選択肢・訳・模範解答)は言わず、問いの形でヒントを出す。「わかった?」のようなyes/noで終わる問いにはしない。

C. 参照資料の場所(「動画どこ?」「やさまるの何ページ?」など)
【今の状況】にあるページ番号・動画番号をそのまま教える。

切り替え:
- Bを解いている途中でも、公式・用語・単語など「Aにあたる部品」を聞かれたら、その部品はAとしてすぐ答える。問題自体の答えは言わない。
- Aの答えに「なんで?」と聞かれたら、そこからはBとして扱う。

# Bの進め方(手順ではなく方針)
- つまずきが「どこで」起きているかを決めつけず、1問目は状況を切り分ける問いにする。
- 返答に合わせて問いの抽象度を上げ下げする。わかっている部分は聞き直さない。
- 本人が以前使った表現があれば、それを使って問いかける。
- 同じ論点で3ターン前進しない、または「教えて」が2回出たら、次の1手だけ具体的に示し「ここから先は自分でやってみて」とつなぐ(最終的な答えは言わない)。

# 香凜さんの傾向(参考。決めつけない)
- 手順の最後で崩れやすい(約分忘れ、代入後の計算、符号)
- ドリルではできるのにテストで崩れる(再現性不足)
- 英語はbe動詞文と一般動詞文が混ざりやすい
- 応用問題を見た瞬間に「わからない」と止まりやすい。まず1手目を一緒に

# 話し方
- 1ターン2〜3文。長い解説を一度に返さない。
- 友達のような話し言葉(です・ます調は使わない)。絵文字は🐾程度に控えめ。
- 説教や「なんで間違えたの?」のような詰問はしない。できたことは素直に喜ぶ。

# 例
香凜:「けんとうって、検討?見当?」
ポメ:「"検討"はよく調べて考えること、"見当"はだいたいの予想だよ!見当は『見て当てる』で覚えよう🐾 じゃあ問題、『犯人の〇〇がつかない』はどっち?」

香凜:「2x+3=11がわかんない」
ポメ:「一緒にやろう!xの横にくっついてる『+3』をどかしたいんだけど、両辺に何をすればいいと思う?」`;

/* ---------- 3段階目:日課表(今日の日課・カレンダー・今週・時間の目安タイマー) ----------
 * 日の種類 B/A/暗記のみ/休み。メイン教科は B日 ごとに 国→数→社→理→英→数 の順で回る(日付から計算するので、保存は日ごとの種類・手で変えたメイン教科・チェックだけ)。
 * D.plan = {anchor, days:{日付:{type,main}}, tests:[{date}], phase:[1期,2期,3期の日数], done:{日付:{行:true}}, timer} */
const DAY_TYPES={B:"通常",A:"暗記＋直し",memo:"暗記のみ",off:"休み"};
const MAINS=[{id:"jpn",name:"国語",ch:"国"},{id:"math",name:"数学",ch:"数"},{id:"soc",name:"社会",ch:"社"},{id:"sci",name:"理科",ch:"理"},{id:"eng",name:"英語",ch:"英"}];
const ROT=["jpn","math","soc","sci","eng","math"];
const mainName=id=>(MAINS.find(m=>m.id===id)||{}).name||"";
const mainCh=id=>(MAINS.find(m=>m.id===id)||{}).ch||"";
const WDAY="日月火水木金土";
const isoOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dateOf=iso=>new Date(iso+"T00:00:00");
const addDaysIso=(iso,n)=>{const d=dateOf(iso);d.setDate(d.getDate()+n);return isoOf(d);};
const daysBetween=(a,b)=>Math.round((dateOf(b)-dateOf(a))/864e5);
const dowOf=iso=>dateOf(iso).getDay();
const mdOf=iso=>{const d=dateOf(iso);return (d.getMonth()+1)+"/"+d.getDate();};
const mondayOf=iso=>addDaysIso(iso,-((dowOf(iso)+6)%7));

function planInit(){
 const p=D.plan;
 if(!p.days)p.days={};if(!p.tests)p.tests=[];if(!p.done)p.done={};
 if(!Array.isArray(p.phase)||p.phase.length!==3)p.phase=[5,5,3];
 if(!p.anchor){p.anchor=today();save("plan");}
 return p;}
const planTypeOf=iso=>((planInit().days[iso]||{}).type)||"B";
/** 日付→メイン教科(Bの日だけ)。anchorの日から順に歩いて決める。手で変えた日は、変えた教科が「次の順番」と同じ時だけ順番を進める(飛ばされた教科は次のB日へ回る) */
function planMainMap(until){
 const p=planInit(),map={};let k=0;
 for(let d=p.anchor;d<=until;d=addDaysIso(d,1)){
  if(planTypeOf(d)!=="B")continue;
  const ov=(p.days[d]||{}).main;
  if(ov){map[d]=ov;if(ov===ROT[k]){k=(k+1)%ROT.length;}}
  else{map[d]=ROT[k];k=(k+1)%ROT.length;}}
 return map;}
/** テスト前の期(1〜3、0=なし)。いちばん近い、これからのテスト日から逆算する。
 * 数えるのは「通常」の日だけ(暗記のみ・暗記＋直し・休み・テストの日は期の中身が無いので数えず、その分だけ前へ繰り上がる) */
function planPhaseOf(iso){
 const p=planInit(),td=new Set(p.tests.map(x=>x.date));
 if(td.has(iso))return {phase:0,left:0};
 const t=[...td].filter(d=>d>iso).sort()[0];
 if(!t)return {phase:0,left:null};
 const [a,b,c]=p.phase,all=a+b+c;
 let n=0;for(let d=iso;d<t&&n<=all;d=addDaysIso(d,1))if(planTypeOf(d)==="B"&&!td.has(d))n++;
 if(planTypeOf(iso)!=="B")return {phase:0,left:daysBetween(iso,t),test:t};
 let ph=0;if(n<=c)ph=3;else if(n<=c+b)ph=2;else if(n<=c+b+a)ph=1;
 return {phase:ph,left:daysBetween(iso,t),test:t};}
const PH_TEXT={
 1:{t:"検査→ワーク1回目",h:"各教科のまとめ問題を『検査』として解く → ×の出た単元から順に、紙のワークを見ずに解く(1回目)。必ず入れる:理科の仕上げページ(キホンの入試〜単元の完成)、数学の1学期範囲"},
 2:{t:"解き直し(1回目)",h:"間違えたところを、紙のワークで解き直す(1回目)"},
 3:{t:"解き直し(2回目)・模擬テスト",h:"間違えたところの2回目→見ずに解けるまで。まとめ問題の2回目。模擬テストは初めて見る問題で(攻略本の予想問題・30分100点)。余裕があれば教科書の章末問題・アウトプット問題集。社会は『ちがいに注意』の対を声に出して言う"}};
/** その日の暗記の中身。A日と暗記のみは「英単語か漢字」(日にちで交互) */
function planMemoOf(type,main,iso){
 if(type==="B"){
  if(main==="jpn")return{label:"漢字",sub:"jpn"};
  if(main==="soc")return{label:"社会",sub:"soc"};
  if(main==="sci")return{label:"理科",sub:"sci"};
  return{label:"英単語",sub:"eng"};}
 return dateOf(iso).getDate()%2?{label:"漢字",sub:"jpn"}:{label:"英単語",sub:"eng"};}
function planDayInfo(iso){
 const type=planTypeOf(iso);
 const main=type==="B"?planMainMap(iso)[iso]:null;
 const pp=planPhaseOf(iso),ph={phase:type==="B"?pp.phase:0,left:pp.left};
 const mn=mainName(main),memo=planMemoOf(type,main,iso),rows=[];
 const X={key:"x",no:"①",title:"前日の×",hint:"きのうの×を解き直す",min:15,act:"drill"};
 const M={key:"memo",no:"②",title:"暗記",hint:memo.label+"の暗記カード",min:15,act:"cards",sub:memo.sub};
 if(type==="B"){
  rows.push(X,M,
   {key:"sapuri",no:"③",title:"スタサプ",hint:"スタサプ "+mn+(ph.phase?" テスト対策の講座":" 今週のミッション"),min:30,act:"link"},
   {key:"rest",no:"④",title:"休憩",hint:"ひと息つく",min:15,act:"none"},
   {key:"work",no:"⑤",title:ph.phase?PH_TEXT[ph.phase].t:"学校ワーク",hint:ph.phase?PH_TEXT[ph.phase].h:"学校ワーク "+mn,min:40,act:"drill"},
   {key:"fix",no:"⑥",title:"直し",hint:"答えを見て理解する",min:20,act:"none"});
 }else if(type==="A"){rows.push(X,{...M,hint:memo.label+"の暗記カード(すきま時間)"});}
 else if(type==="memo"){rows.push({...M,no:"①"});}
 return {iso,type,main,mn,phase:ph.phase,left:ph.left,rows};}
const planDone=iso=>planInit().done[iso]||{};
function planMark(iso,key,on){
 const p=planInit();
 if(!p.done[iso])p.done[iso]={};
 if(on)p.done[iso][key]=true;else delete p.done[iso][key];
 if(!Object.keys(p.done[iso]).length)delete p.done[iso];
 save("plan");}
const planCount=info=>{const dn=planDone(info.iso);return{n:info.rows.filter(r=>dn[r.key]).length,all:info.rows.length};};

/* --- 時間の目安タイマー(行をタップすると始まる。時間が来たらやさしい音。順番が大事で、時間は目安) --- */
let AC=null;
function planAudio(){
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return false;
  if(!AC)AC=new Ctx();if(AC.state==="suspended")AC.resume();
  return true;
 }catch(e){return false;}}
function planChime(){
 try{
  if(!planAudio())return;
  [[784,0],[988,.65],[1175,1.3]].forEach(([f,t0])=>{ // ソ→シ→レ。1音0.7秒、ぜんぶで2秒ほど
   const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
   o.type="triangle";o.frequency.value=f;o2.type="sine";o2.frequency.value=f*2;
   o.connect(g);o2.connect(g);g.connect(AC.destination);
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.7);
   o.start(t);o2.start(t);o.stop(t+.72);o2.stop(t+.72);});
  if(navigator.vibrate)navigator.vibrate([300,120,300,120,300]);
 }catch(e){}}
function planTimerStart(iso,key,min){
 const p=planInit();
 planAudio(); // 音を鳴らす許可は、タップした時にとっておく
 if(p.timer&&p.timer.date===iso&&p.timer.key===key&&p.timer.endsAt>Date.now())return; // 動いている最中ならそのまま
 p.timer={date:iso,key,min,endsAt:Date.now()+min*60000,fired:false};
 save("plan");planTimerRender();}
function planTimerStop(){planInit().timer=null;save("plan");planTimerRender();}
function planTimerDone(){
 const t=planInit().timer;if(!t)return;
 planMark(t.date,t.key,true);planInit().timer=null;save("plan");planTimerRender();renderCurrent();}
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");};
function planTimerRender(){
 const bar=qs("#timerbar"),t=planInit().timer;
 if(t&&t.date!==today()){D.plan.timer=null;save("plan");}
 const tt=D.plan.timer;
 document.body.classList.toggle("hasTimer",!!tt);
 if(!tt){bar.innerHTML="";return;}
 const info=planDayInfo(tt.date),r=info.rows.find(x=>x.key===tt.key);
 const nm=r?(r.no+" "+r.title):"";
 const left=tt.endsAt-Date.now();
 bar.innerHTML=left>0
  ?`<span class="tb-t">⏱ ${esc(nm)}</span><b class="tb-c">${mmss(left)}</b><button class="tb-b" onclick="planTimerDone()">✓ おわった</button><button class="tb-b sub" onclick="planTimerStop()">とめる</button>`
  :`<span class="tb-t">🔔 時間です(つづけてもOK)</span><button class="tb-b" onclick="planTimerDone()">✓ おわった</button><button class="tb-b sub" onclick="planTimerStop()">とめる</button>`;}
function planTick(){
 const t=D.plan&&D.plan.timer;if(!t)return;
 if(!t.fired&&Date.now()>=t.endsAt){t.fired=true;save("plan");planChime();toast("🔔 時間です。つづけても、おわってもOK");}
 planTimerRender();}

let PLAN_FROM=null; // 日課の暗記から暗記カードを開いている間だけ入る(画面用・保存しない)

/* --- 保護者:カレンダー --- */
let calMonth=null,calMode="A";
const CAL_MODES=[["B","通常"],["A","暗記＋直し"],["memo","暗記のみ"],["off","休み"],["main","🎯 メイン教科"],["test","📝 テスト日"]];
function calShift(n){const [y,m]=calMonth.split("-").map(Number);const d=new Date(y,m-1+n,1);calMonth=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");renderCurrent();}
const calCanEdit=()=>document.body.classList.contains("parent");
function calTap(iso){
 if(!calCanEdit())return;
 const p=planInit();
 if(["B","A","memo","off"].includes(calMode)){
  const e=p.days[iso]||{};e.type=calMode;
  if(calMode!=="B")delete e.main;
  if(calMode==="B"&&!e.main)delete p.days[iso];else p.days[iso]=e;
  save("plan");renderCurrent();}
 else if(calMode==="test"){

/* ---------- 4段階目:ワークドリル ----------
 * ワークのページ写真を丸ごと出し、大問の位置にズームして、小問ごとに答える。答え合わせ・×の記録・出し直しはアプリがやる。
 * 写真:IndexedDB pages ストア(キー「本のキー|q|ページ」=問題ページ、「本のキー|a|ページ」=そのページの解答ページ)
 * D.drill = {books:{本のキー:{key,workbook,subject,importedAt,pages:[{page,answerPage,blocks:[{bid,unit,no,region,answerRegion,items}]}]}},
 *            log:{小問id:[{d:日付,ok,a:答え,paper?,fixed?}]}, skip:{大問id:日付}, reports:[…], alt:{小問id:[保護者が○に直した答え]}} */
const SUB_ORDER=["math","eng","jpn","sci","geo","his"];
let DX=null; // 問題の索引(画面用・保存しない)。取り込み・削除のたびに作り直す
function drillData(){
 const d=D.drill;
 if(!d.books)d.books={};if(!d.log)d.log={};if(!d.skip)d.skip={};if(!d.reports)d.reports=[];if(!d.alt)d.alt={};
 return d;}
function drillIndex(){
 if(DX)return DX;
 const d=drillData(),X={blocks:[],block:{},items:{},books:[]};
 const books=Object.values(d.books).sort((a,b)=>(SUB_ORDER.indexOf(a.subject)-SUB_ORDER.indexOf(b.subject))||String(a.workbook).localeCompare(b.workbook));
 books.forEach(bk=>{
  X.books.push(bk);
  (bk.pages||[]).slice().sort((a,b)=>a.page-b.page).forEach(pg=>{
   (pg.blocks||[]).forEach(bl=>{
    const B={bk:bk.key,book:bk,page:pg.page,pg,bl,bid:bl.bid,sub:bk.subject};
    X.blocks.push(B);X.block[bl.bid]=B;
    (bl.items||[]).forEach(it=>{X.items[it.id]={it,B};});});});});
 return DX=X;}
const drillHist=id=>drillData().log[id]||[];
/** 小問の状態:new=まだ / ok=○だけ / x=×リストに入っている / grad=×のあと2回続けて○で卒業 */
function drillState(id){
 const h=drillHist(id);if(!h.length)return"new";
 let lx=-1;h.forEach((r,i)=>{if(!r.ok)lx=i;});
 if(lx<0)return"ok";
 return h.length-1-lx>=2?"grad":"x";}
const drillXCount=id=>drillHist(id).filter(r=>!r.ok).length;
const drillNigate=id=>drillXCount(id)>=3;
const drillLast=id=>{const h=drillHist(id);return h[h.length-1]||null;};
/** ×の解き直しに出せるか:×リストにあり、最後に解いたのが今日より前(同じ日には出し直さない) */
const drillRedoable=id=>drillState(id)==="x"&&drillLast(id).d<today();
const drillOpenReports=()=>new Set(drillData().reports.filter(r=>!r.done).map(r=>r.bid));
const drillSkipped=bid=>{const s=drillData().skip[bid];return !!s&&daysBetween(s,today())<7;};
const subLabel=id=>subName(id)||id;

/* --- 判定 --- */
function drillNorm(s,type){
 s=String(s??"").normalize("NFKC").replace(/[’‘]/g,"'").replace(/[“”]/g,'"');
 if(type==="number")s=s.replace(/[−‐‑–—ー]/g,"-");
 if(type==="sentence"||type==="order")s=s.replace(/\s+/g," ").trim().replace(/\s+([,.?!])/g,"$1");
 else s=s.replace(/\s+/g,"");
 return s;}
function drillAccepts(it){return [it.answer,...(it.alt||[]),...(drillData().alt[it.id]||[])].filter(x=>x!=null&&x!=="");}
function drillMatch(it,a){
 const t=it.type==="choice"?"word":it.type,v=drillNorm(a,t);
 if(!v)return false;
 return drillAccepts(it).some(x=>drillNorm(x,t)===v);}
/** 自分の答えと正解の、違う文字に色を付ける(共通部分=LCS以外に印) */
function drillDiff(a,b){
 a=[...String(a||"")];b=[...String(b||"")];
 const n=a.length,m=b.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 const ka=new Array(n).fill(false),kb=new Array(m).fill(false);
 let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ka[i]=kb[j]=true;i++;j++;}else if(L[i+1][j]>=L[i][j+1])i++;else j++;}
 const paint=(arr,keep,cls)=>arr.map((c,k)=>keep[k]?esc(c):`<mark class="${cls}">${c===" "?"␣":esc(c)}</mark>`).join("");
 return {mine:paint(a,ka,"dm"),right:paint(b,kb,"dr")};}
function drillRecord(id,ok,a,extra){
 const d=drillData();if(!d.log[id])d.log[id]=[];
 d.log[id].push({d:today(),ok:!!ok,a:String(a??""),...(extra||{})});
 return d.log[id].length-1;}

/* --- 写真の表示(丸ごと出して、大問の位置にズーム。指でピンチ・ドラッグ) --- */
const IMGC=new Map();
async function drillImg(key){
 if(IMGC.has(key))return IMGC.get(key);
 let v=null;try{v=await dbGet("pages",key);}catch(e){}
 IMGC.set(key,v||null);return v||null;}
const VW={};
const viewerHtml=(id,h)=>`<div class="viewer" id="${id}" style="height:${h}"><div class="vwrap"><img alt=""><div class="vframe"></div></div>
 <div class="vbtns"><button onclick="vZoomBtn('${id}',1.3)">＋</button><button onclick="vZoomBtn('${id}',1/1.3)">－</button><button onclick="vFit('${id}')">ページ全体</button><button onclick="vFocus('${id}')">問題へ</button></div><div class="vload">写真を読み込み中…</div></div>`;
async function viewerSet(id,key,region){
 const el=qs("#"+id);if(!el)return;
 const st=VW[id]={key,region:region||null,s:1,tx:0,ty:0,iw:0,ih:0};
 viewerBind(el);
 const src=await drillImg(key);
 if(VW[id]!==st)return;
 const ld=el.querySelector(".vload");
 if(!src){if(ld)ld.textContent="写真がありません(取り込み直してください)";return;}
 const img=el.querySelector("img");
 img.onload=()=>{st.iw=img.naturalWidth||1000;st.ih=img.naturalHeight||1400;img.style.width=st.iw+"px";img.style.height=st.ih+"px";
  const l=el.querySelector(".vload");if(l)l.remove();vFrame(id);vFocus(id);};
 img.src=src;}
function viewerRegion(id,region){const st=VW[id];if(!st)return;st.region=region||null;vFrame(id);vFocus(id);}
function vFrame(id){
 const el=qs("#"+id),st=VW[id];if(!el||!st)return;
 const f=el.querySelector(".vframe"),r=st.region;
 if(!r||!st.iw){f.style.display="none";return;}
 Object.assign(f.style,{display:"block",left:r.x*st.iw+"px",top:r.y*st.ih+"px",width:r.w*st.iw+"px",height:r.h*st.ih+"px"});}
function vApply(id){
 const el=qs("#"+id),st=VW[id];if(!el||!st)return;
 if(st.iw){ // 写真が画面の外へ全部出てしまわないように(端が少しは残る)
  const W=el.clientWidth||600,H=el.clientHeight||400,m=60,pw=st.iw*st.s,ph=st.ih*st.s;
  st.tx=Math.min(W-m,Math.max(m-pw,st.tx));st.ty=Math.min(H-m,Math.max(m-ph,st.ty));}
 el.querySelector(".vwrap").style.transform=`translate(${st.tx}px,${st.ty}px) scale(${st.s})`;
 el.querySelector(".vframe").style.borderWidth=Math.max(2,3/st.s)+"px";}
function vFocus(id){
 const el=qs("#"+id),st=VW[id];if(!el||!st||!st.iw)return;
 const W=el.clientWidth||600,H=el.clientHeight||400,r=st.region||{x:0,y:0,w:1,h:1};
 st.s=Math.min(W/(r.w*st.iw),H/(r.h*st.ih))*0.94;
 st.tx=W/2-(r.x+r.w/2)*st.iw*st.s;st.ty=H/2-(r.y+r.h/2)*st.ih*st.s;vApply(id);}
function vFit(id){
 const el=qs("#"+id),st=VW[id];if(!el||!st||!st.iw)return;
 const W=el.clientWidth||600,H=el.clientHeight||400;
 st.s=Math.min(W/st.iw,H/st.ih);st.tx=(W-st.iw*st.s)/2;st.ty=(H-st.ih*st.s)/2;vApply(id);}
function vZoomBtn(id){const el=qs("#"+id),st=VW[id];if(!el||!st||!st.iw)return;vZoomAt(st,(el.clientWidth||600)/2,(el.clientHeight||400)/2,arguments[1]);vApply(id);}
function vZoomAt(st,mx,my,f){const ns=Math.max(.05,Math.min(8,st.s*f));f=ns/st.s;st.tx=mx-(mx-st.tx)*f;st.ty=my-(my-st.ty)*f;st.s=ns;}
function viewerBind(el){
 if(el._bound)return;el._bound=true;
 const pts=new Map();
 el.addEventListener("pointerdown",e=>{if(e.target.closest(".vbtns"))return;e.preventDefault(); // 文字の選択やドラッグが始まって、つかめなくなるのを防ぐ
  try{el.setPointerCapture(e.pointerId);}catch(_){}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});el.classList.add("grabbing");});
 el.addEventListener("dragstart",e=>e.preventDefault());
 el.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId))return;const st=VW[el.id];if(!st)return;
  const prev=pts.get(e.pointerId),cur={x:e.clientX,y:e.clientY};
  if(pts.size===1){st.tx+=cur.x-prev.x;st.ty+=cur.y-prev.y;}
  else{const o=[...pts.entries()].find(([k])=>k!==e.pointerId)[1];
   const d0=Math.hypot(prev.x-o.x,prev.y-o.y),d1=Math.hypot(cur.x-o.x,cur.y-o.y),rc=el.getBoundingClientRect();
   if(d0>0)vZoomAt(st,(cur.x+o.x)/2-rc.left,(cur.y+o.y)/2-rc.top,d1/d0);}
  pts.set(e.pointerId,cur);vApply(el.id);});
 const up=e=>{pts.delete(e.pointerId);if(!pts.size)el.classList.remove("grabbing");};
 el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);el.addEventListener("lostpointercapture",up);
 el.addEventListener("wheel",e=>{const st=VW[el.id];if(!st)return;e.preventDefault();const rc=el.getBoundingClientRect();vZoomAt(st,e.clientX-rc.left,e.clientY-rc.top,e.deltaY<0?1.15:1/1.15);vApply(el.id);},{passive:false});}

/* --- 出す順番 --- */
const DRILL_WORK_MAX=10; // 「つづきから」で1回に出す大問の数
function drillBuildQueue(mode,opt){
 const X=drillIndex(),rep=drillOpenReports(),q=[];
 if(mode==="work"){ // その教科の、まだ解いていない小問をページ順に(range:テスト範囲のページだけ)
  const R=opt.range?examWork(opt.sub).pages:null;
  for(const B of X.blocks){
   if(B.sub!==opt.sub||rep.has(B.bid)||drillSkipped(B.bid)||(R&&!R.has(B.page)))continue;
   const ids=(B.bl.items||[]).filter(it=>!drillHist(it.id).length).map(it=>it.id);
   if(ids.length)q.push({bid:B.bid,ids});
   if(q.length>=DRILL_WORK_MAX)break;}}
 else if(mode==="redo"){ // ×の解き直し:前日以前の×を、教科をまたいで古い順に。×だった小問だけ
  const by={};
  Object.keys(X.items).forEach(id=>{
   const {B}=X.items[id];if(rep.has(B.bid)||!drillRedoable(id))return;
   const h=drillHist(id),lastX=[...h].reverse().find(r=>!r.ok).d;
   if(!by[B.bid])by[B.bid]={bid:B.bid,ids:[],d:lastX};
   by[B.bid].ids.push(id);if(lastX<by[B.bid].d)by[B.bid].d=lastX;});
  const order=X.blocks.map(B=>B.bid);
  q.push(...Object.values(by).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:order.indexOf(a.bid)-order.indexOf(b.bid)).map(({bid,ids})=>({bid,ids})));}
 else if(mode==="page"){ // ページを選んで:そのページの全部(今日×だったものは、あしたまで出さない)
  for(const B of X.blocks){
   if(B.bk!==opt.bk||B.page!==opt.page||rep.has(B.bid))continue;
   const ids=(B.bl.items||[]).filter(it=>{const l=drillLast(it.id);return !(l&&l.d===today()&&!l.ok);}).map(it=>it.id);
   if(ids.length)q.push({bid:B.bid,ids});}}
 return q;}
const drillWorkLeft=(sub,R)=>{const X=drillIndex(),rep=drillOpenReports();let n=0;X.blocks.forEach(B=>{if(B.sub!==sub||rep.has(B.bid)||drillSkipped(B.bid)||(R&&!R.has(B.page)))return;(B.bl.items||[]).forEach(it=>{if(!drillHist(it.id).length)n++;});});return n;};
const drillRedoLeft=()=>{const X=drillIndex(),rep=drillOpenReports();return Object.keys(X.items).filter(id=>!rep.has(X.items[id].B.bid)&&drillRedoable(id)).length;};

/* --- 解く画面 --- */
let DS=null; // 今解いている状態(画面用・保存しない)
function drillStart(mode,opt){
 const q=drillBuildQueue(mode,opt||{});
 if(!q.length){toast(mode==="redo"?"×の解き直しは、いまはありません":"出せる問題がありません");return;}
 DS={mode,opt:opt||{},q,i:0,ok:0,ng:0,cur:null};drillPrep();goTo("solve");}
function drillPrep(){DS.cur={ans:{},judged:{},ok:{},show:{},rub:{},order:{},rec:[],reported:false};}
const drillEntry=()=>DS.q[DS.i];
const drillItemsNow=()=>{const X=drillIndex();return drillEntry().ids.map(id=>X.items[id]?X.items[id].it:null).filter(Boolean);};
RENDER.solve=function(){
 const el=qs("#s-solve");
 if(!DS){el.innerHTML=`<div class="card"><p class="note">問題がありません。</p></div>`;return;}
 if(DS.i>=DS.q.length){
  el.innerHTML=`<div class="cr-end"><div class="big">${DS.ng?"👏":"🎉"}</div><h2>おわり!</h2>
   <div class="score"><span>○ ${DS.ok}</span><span>× ${DS.ng}</span></div>
   <p class="note">${DS.ng?"×だった問題は、<b>あした以降</b>の「×の解き直し」に出ます。":"ぜんぶ○でした。"}</p>
   <div class="btnrow"><button class="btn" onclick="drillExit()">✅ おわる</button></div></div>`;return;}
 el.innerHTML=`<div class="sv-head" id="svHead"></div>${viewerHtml("svView","42vh")}<div class="sv-items" id="svItems"></div>`;
 delete VW.svView;
 solveDraw();};
function drillExit(){DS=null;goBack();}
function solveDraw(){
 const X=drillIndex(),e=drillEntry(),B=X.block[e.bid];
 if(!B){DS.i++;if(DS.i<DS.q.length){drillPrep();solveDraw();}else RENDER.solve();return;}
 const key=B.bk+"|q|"+B.page;
 qs("#svHead").innerHTML=`<b>${esc(subLabel(B.sub))}</b>${B.bl.unit?"｜"+esc(B.bl.unit):""}　${esc(B.book.workbook)} p${B.page} ${esc(B.bl.no||"")}<span class="grow"></span><span class="svpos">${DS.i+1}/${DS.q.length}</span>`;
 if(VW.svView&&VW.svView.key===key)viewerRegion("svView",B.bl.region);else viewerSet("svView",key,B.bl.region);
 drawItems();}
function itemInputHtml(it,k){

 pages.forEach(p=>{const B=X.blocks.find(B=>B.bk===bk.key&&B.page===p&&B.bl.unit),u=B?B.bl.unit:"",last=rows[rows.length-1];

/* --- 目次(ワークの目次の写真→Claude→返事を貼る)
 * bk.toc = [{no,title,from,to}](ワークのページ)。学校ドリルの一覧を単元ごとに並べるのに使う --- */
function tocRules(bk){
 return `この写真は、中学校の学校ワーク「${bk.workbook}」(${subLabel(bk.subject)})の目次です。家庭学習アプリ「まなびば」に取り込むため、次の形式のJSONだけを、コードブロック1つで返してください。ファイルは作らなくてよいです。

{"toc":[{"no":"1-1","title":"始まりの風","from":12,"to":16},{"no":"1-2","title":"言葉1 音声の仕組みや働き","from":17,"to":18}]}

- 目次の上から順に、ページが書いてある項目を1つずつ入れる。
- no:目次の番号を書いてあるとおりに(1-1、Unit 3、1章2節 など。無ければ "")。title:単元名を目次の書き方のまま。
- from/to:その項目の「ワーク」のページの最初と最後。最後が書いていなければ、次の項目の最初のページの1つ前。教科書のページの列があっても、ワークのページを使う。
- 章の見出しだけでページが無い行は入れなくてよい。
- 手書きの書き込みは無視する。読めない所があれば、JSONの外に1行で書く。`;}
function replyJson(txt){
 const s=String(txt||""),i=s.indexOf("{"),j=s.lastIndexOf("}");
 if(i<0||j<i)throw new Error("Claudeの返事の中に、取り込む部分({ … })が見つかりません。返事を全部コピーして貼ってください");
 try{return JSON.parse(s.slice(i,j+1));}catch(e){throw new Error("返事の形がこわれています。Claudeに「JSONだけをもう一度」と頼んでください");}}
function tocParse(txt){
 const j=replyJson(txt),n=v=>parseInt(String(v??"").normalize("NFKC").replace(/[^\d]/g,""),10)||0;
 const raw=(Array.isArray(j.toc)?j.toc:[]).map(x=>({no:String(x.no||"").trim(),title:String(x.title||"").trim(),from:n(x.from),to:n(x.to)})).filter(x=>x.from&&(x.title||x.no));
 if(!raw.length)throw new Error("目次の項目が読めませんでした");
 raw.sort((a,b)=>a.from-b.from);
 raw.forEach((x,i)=>{if(!x.to||x.to<x.from)x.to=raw[i+1]?Math.max(x.from,raw[i+1].from-1):x.from;});
 return raw;}
function tocOpen(key){

 const k=esc(key).replace(/'/g,"");

   <li><b>📋 返事を貼る</b><span>Claudeの返事をコピーして下に貼り、「取り込む」。</span></li>
  </ol>

  <p class="note" style="margin-top:6px">入れた目次は、学校ドリルの一覧で、ページを単元ごとに並べるのに使います。入れ直すと置きかわります(解いた記録はそのまま)。</p>`);}

/* --- 取り込み(保護者モード→③) --- */
function drillImportJson(j){
 if(!j||!Array.isArray(j.pages))throw new Error("ワークのファイルではありません(pages がありません)");
 if(!SUBJECTS.some(s=>s.id===j.subject))throw new Error("教科(subject)が読めません:"+j.subject);
 const d=drillData(),key=j.subject+"|"+(j.workbook||"ワーク");
 const bk=d.books[key]||(d.books[key]={key,workbook:j.workbook||"ワーク",subject:j.subject,pages:[]});
 const rep={key,workbook:bk.workbook,subject:j.subject,pages:[],blocks:0,items:0,warn:[],imgs:[]};
 j.pages.forEach(pg=>{
  const page=Number(pg.page);if(!page){rep.warn.push("ページ番号が無いページがありました(飛ばしました)");return;}
  const blocks=(pg.blocks||[]).map((bl,bi)=>{
   const bid=bl.bid||`${j.subject}-w${page}-${bl.no||bi+1}`;
   if(!bl.region)rep.warn.push(`p${page} ${bl.no||""}:位置(region)が無いので、ページ全体を出します`);
   const items=(bl.items||[]).map((it,ii)=>{
    const id=it.id||`${bid}-${ii+1}`;
    if(!["choice","order","word","number","sentence","self"].includes(it.type))rep.warn.push(`p${page} ${bl.no||""}${it.no||""}:答え方(type)が読めないので、自分で判定する形にしました`);
    if(it.type!=="self"&&!it.answer)rep.warn.push(`p${page} ${bl.no||""}${it.no||""}:正解がありません`);
    return {...it,id,type:["choice","order","word","number","sentence","self"].includes(it.type)?it.type:"self"};});
   rep.items+=items.length;
   return {bid,unit:bl.unit||"",no:bl.no||"",region:bl.region||null,answerRegion:bl.answerRegion||null,items};});
  rep.blocks+=blocks.length;
  const i=bk.pages.findIndex(p=>p.page===page),obj={page,answerPage:pg.answerPage||null,blocks};
  if(i>=0)bk.pages[i]=obj;else bk.pages.push(obj); // 同じページは上書き(○×は小問idで引き継がれる)
  if(pg.image)rep.imgs.push([key+"|q|"+page,pg.image]);else rep.warn.push(`p${page}:ページの写真がありません`);
  if(pg.answerImage)rep.imgs.push([key+"|a|"+page,pg.answerImage]);
  rep.pages.push(page);});
 bk.pages.sort((a,b)=>a.page-b.page);bk.importedAt=new Date().toISOString();
 return rep;}
async function drillImportFile(inp){
 const files=[...inp.files];inp.value="";if(!files.length)return;
 const out=[];
 for(const f of files){
  try{
   const txt=await f.text(),j=JSON.parse(txt);
   const rep=drillImportJson(j);
   for(const [k,v] of rep.imgs){await dbPut("pages",k,v);IMGC.delete(k);}
   out.push(rep);
  }catch(e){out.push({error:f.name+":"+e.message});}}
 DX=null;await save("drill");
 drillLastImport=out;renderCurrent();
 const ok=out.filter(r=>!r.error);
 if(ok.length)toast("取り込みました("+ok.map(r=>subLabel(r.subject)+" "+r.pages.length+"ページ").join("、")+")");}

- 学校ワークの「問題ページ」と「解答ページ」の写真(スマホで撮影。順番・ファイル名はばらばら)。

# やること
1. 写真ごとにページ番号を読み、問題ページと解答ページを見分けて対応づける。
2. 写真は「傾きを直して、長辺1400px程度・JPEG(品質0.7前後、1枚200KB前後)に縮小」するだけで、切り抜かない。コード実行を使い、data:image/jpeg;base64,… の形でファイルに埋め込む。
3. 問題ページの大問ごとに、ページ写真の中の位置 region({x,y,w,h}。写真の幅・高さに対する0〜1の割合。少し余白を含める)と、解答ページの中の位置 answerRegion を決める。
4. 大問の中の小問ごとに、正解と答え方を作る。問題文は書き写さない。
5. 下の形式で、1つの .json ファイルを作ってダウンロードできるようにする(ファイル名の例:work_math_p52-58.json)。
6. 読めないページ・解答ページが足りないページがあれば、ファイルとは別に「撮り直してほしいページ」をはっきり書く。

# 形式
{"workbook":"数学ワーク","subject":"math","pages":[
 {"page":52,"image":"data:image/jpeg;base64,...","answerPage":12,"answerImage":"data:image/jpeg;base64,...",
  "blocks":[{"bid":"math-w52-2","unit":"文字式の利用","no":"2",
   "region":{"x":0.0,"y":0.42,"w":1.0,"h":0.33},"answerRegion":{"x":0.5,"y":0.1,"w":0.5,"h":0.15},
   "items":[{"id":"math-w52-2-1","no":"(1)","type":"number","answer":"20-x","alt":["-x+20"],"exp":"縦＋横＝20だから 横＝20-x"},
            {"id":"math-w52-2-2","no":"(2)","type":"self","answer":"x(20-x) cm²","rubric":["式を書いている","答えに単位 cm² がある"]}]}]}]}

- subject:math=数学、eng=英語、jpn=国語、sci=理科、geo=地理、his=歴史 のどれか。
- id は「教科-wページ-大問-小問の順番」で必ず付け、同じ問題なら毎回同じ id にする(取り込み直しても記録が引き継がれるため)。
- type:choice(選択・記号。choices に記号の一覧を入れる)/order(英語の並べかえ。words に語の一覧、answer に完成した文)/word(語句・漢字)/number(数値・式の答え)/sentence(英文)/self(途中式・記述・作図など、ノートに書いて自分で判定するもの。rubric に採点の目安を2〜4個)。
- answer は解答ページのとおりに。英語のコンマ・「?」・大文字、数学の符号と単位もそのまま書く。alt には、正解として認めてよい別の書き方を入れる。
- exp は解答ページに解説があれば短く入れる。
- 手書きの書き込み(丸つけ・答えの書き込み)は無視する。
- べき乗は上付き文字(5²など)を使う。`;
function copyText(t){
 const done=()=>toast("コピーしました");
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallback());else fallback();
 function fallback(){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){toast("コピーできませんでした");}ta.remove();}}
async function drillDeleteBook(key){
 const bk=drillData().books[key];if(!bk)return;
 if(!confirm("「"+bk.workbook+"」を消します。(解いた記録は残ります)\nよろしいですか?"))return;
 for(const p of bk.pages){for(const t of ["q","a"]){try{await dbTx("pages","readwrite",st=>st.delete(key+"|"+t+"|"+p.page));}catch(e){}IMGC.delete(key+"|"+t+"|"+p.page);}}
 delete drillData().books[key];DX=null;await save("drill");renderCurrent();toast("消しました");}

/* --- お試しのワーク(本物のワークが届くまで、画面を試す用) --- */
function sampleSvg(page,title,blocks,isAns){
 const W=1000,H=1400;let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#fffef8"/>`;
 s+=`<text x="40" y="70" font-size="34" font-family="sans-serif" fill="#333">${isAns?"解答 ":""}${title}</text><text x="${W-40}" y="70" font-size="30" text-anchor="end" font-family="sans-serif" fill="#666">p.${page}</text>`;
 blocks.forEach(b=>{const r=b.r;s+=`<rect x="${r.x*W}" y="${r.y*H}" width="${r.w*W}" height="${r.h*H}" fill="none" stroke="#bbb" stroke-width="2" rx="10"/>`;
  b.lines.forEach((l,i)=>{s+=`<text x="${r.x*W+24}" y="${r.y*H+50+i*48}" font-size="${i?28:32}" font-family="sans-serif" fill="${isAns?"#c33":"#222"}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</text>`;});});
 return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s+"</svg>");}

/** 範囲のワークのページ [[最初,最後],…]。Claudeの返事の pages、無ければ範囲の文の「ワーク p52〜70」から拾う */
function examPageList(v){
 const out=[];(Array.isArray(v)?v:[]).forEach(r=>{
  let a,b;
  if(Array.isArray(r)){a=+r[0];b=+(r[1]??r[0]);}
  else if(typeof r==="number"){a=b=r;}
  else{const m=String(r).normalize("NFKC").match(/(\d+)\D*(\d+)?/);if(m){a=+m[1];b=+(m[2]||m[1]);}}
  if(a>0&&b>0)out.push([Math.min(a,b),Math.max(a,b)]);});
 return out;}
function examRangeNums(x){
 if(x.pages&&x.pages.length)return x.pages;
 const s=String(x.range||"").normalize("NFKC"),i=s.indexOf("ワーク");if(i<0)return[];
 const t=s.slice(i+3).split(/教科書|プリント|ノート|資料/)[0],out=[];
 t.replace(/(\d+)\s*(?:[〜~\-−ー–]\s*p?\.?\s*(\d+))?/g,(m,a,b)=>{out.push([+a,+(b||a)]);return m;});
 return out.filter(([a,b])=>a>0&&b>=a);}
const EXAM_SUBMAP={soc:["geo","his"]};
/** 学校ドリルの教科ごとの、テスト範囲。inExam=範囲表にその教科がある、pages=ワークのページ(分からなければnull) */
function examWork(sub){
 const e=examActive();if(!e)return {inExam:false,pages:null};
 const xs=e.subjects.filter(x=>x.subject===sub||(EXAM_SUBMAP[x.subject]||[]).includes(sub));
 if(!xs.length)return {inExam:false,pages:null};
 const s=new Set();xs.forEach(x=>examRangeNums(x).forEach(([a,b])=>{for(let p=a;p<=b&&p-a<400;p++)s.add(p);}));
 return {inExam:true,pages:s.size?s:null};}

/* ---------- テスト範囲・提出物 ----------
 * D.plan.exam = {name, dates:[日付], subjects:[{subject,label,range}], subs:[{id,subject,label,name,due,done}], at}
 * 範囲表の写真をClaudeに送り、返ってきた文をそのまま貼って取り込む。提出物のチェックは香凜さんが付ける */
const examData=()=>planInit().exam||null;
const examLabel=x=>x.label||subLabel(x.subject)||"その他";
const examLast=e=>(e&&e.dates&&e.dates.length)?[...e.dates].sort().slice(-1)[0]:null;
const examActive=()=>{const e=examData();if(!e)return null;const l=examLast(e);return(!l||l>=today())?e:null;};
const examSubsLeft=e=>(e&&e.subs||[]).filter(s=>!s.done);
const examDue=(e,s)=>s.due||(e.dates&&e.dates.length?[...e.dates].sort()[0]:null);
const EXAM_ORDER=["jpn","math","eng","sci","soc","geo","his"];
const examSort=(a,b)=>{const ia=EXAM_ORDER.indexOf(a.subject),ib=EXAM_ORDER.indexOf(b.subject);return (ia<0?99:ia)-(ib<0?99:ib);};
function examRules(){
 const y=new Date().getFullYear();
 return `この写真は、中学校の「テスト範囲表」(提出物の一覧つき)です。家庭学習アプリ「まなびば」に取り込むため、次の形式のJSONだけを、コードブロック1つで返してください。ファイルは作らなくてよいです。

{"name":"2学期期末テスト","dates":["${y}-11-24","${y}-11-25"],
 "subjects":[{"subject":"math","label":"数学","range":"教科書p40〜58、ワークp52〜70、74〜75","pages":[[52,70],[74,75]]}],
 "submissions":[{"subject":"math","label":"数学","name":"数学ワーク p52〜70(丸つけ・直しまで)","due":"${y}-11-24"}]}

- name:テストの名前。dates:テストの日すべて(YYYY-MM-DD)。年が書いていなければ${y}年。
- subject:math=数学、eng=英語、jpn=国語、sci=理科、geo=地理、his=歴史。社会で地理・歴史が分かれていなければ soc。それ以外の教科(音楽・美術・保健体育・技術家庭など)は other にして、label に教科名を入れる。
- range:範囲を、表の書き方のまま短く(教科書・ワーク・プリントのページなど)。
- pages:範囲のうち「ワーク(問題集)」のページだけを、[最初,最後] の組で。ワークのページが書いていなければ []。
- submissions:提出物を1つずつ。name は何をどこまでやるかが分かるように短く。提出日が書いてあれば due に日付、書いていなければ null(テストの日に出す扱い)。
- 手書きの書き込みは無視する。読めない所があれば、JSONの外に1行で書く。`;}
function examParse(txt){
 const s=String(txt||""),i=s.indexOf("{"),j=s.lastIndexOf("}");
 if(i<0||j<i)throw new Error("Claudeの返事の中に、取り込む部分({ … })が見つかりません。返事を全部コピーして貼ってください");
 let j0;try{j0=JSON.parse(s.slice(i,j+1));}catch(e){throw new Error("返事の形がこわれています。Claudeに「JSONだけをもう一度」と頼んでください");}
 const isoOk=d=>typeof d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d);
 const dates=(j0.dates||[]).filter(isoOk).sort();
 const subjects=(j0.subjects||[]).filter(x=>x&&(x.range||x.pages)).map(x=>({subject:String(x.subject||"other"),label:String(x.label||""),range:String(x.range||""),pages:examPageList(x.pages)}));
 const subs=(j0.submissions||[]).filter(x=>x&&x.name).map(x=>({subject:String(x.subject||"other"),label:String(x.label||""),name:String(x.name),due:isoOk(x.due)?x.due:null}));
 if(!dates.length&&!subjects.length&&!subs.length)throw new Error("テストの日・範囲・提出物のどれも読めませんでした");
 return {name:String(j0.name||"テスト"),dates,subjects,subs};}
let examMsg=null;
function examImport(){
 const ta=qs("#examPaste");if(!ta)return;
 let r;try{r=examParse(ta.value);}catch(e){examMsg={err:e.message};renderCurrent();return;}
 const p=planInit(),old=p.exam,key=s=>s.subject+"|"+s.name.replace(/\s+/g,"");
 const keep={};((old&&old.subs)||[]).forEach(s=>{if(s.done)keep[key(s)]=s.done;});
 p.exam={name:r.name,dates:r.dates,subjects:r.subjects.sort(examSort),
  subs:r.subs.sort(examSort).map((s,i)=>({id:"s"+Date.now().toString(36)+i,...s,done:keep[key(s)]||false})),at:today()};
 // テストの日はカレンダーにも入れる(すでにある日はそのまま)
 let added=0;r.dates.forEach(d=>{if(!p.tests.some(t=>t.date===d)){p.tests.push({date:d});added++;}});
 p.tests.sort((a,b)=>a.date<b.date?-1:1);
 save("plan");examMsg={ok:`「${r.name}」を取り込みました(範囲${r.subjects.length}教科・提出物${r.subs.length}件${added?"・カレンダーにテスト日"+added+"日":""})`};
 ta.value="";renderCurrent();}
function examToggle(id){
 const e=examData();if(!e)return;const s=e.subs.find(x=>x.id===id);if(!s)return;
 s.done=s.done?false:today();save("plan");renderCurrent();
 if(s.done&&!examSubsLeft(e).length)toast("🎉 提出物ぜんぶ終わり!");}
function examClear(){
 if(!examData())return;
 if(!confirm("テスト範囲と提出物を消します(カレンダーのテスト日はそのまま)。よろしいですか?"))return;
 delete planInit().exam;save("plan");examMsg=null;renderCurrent();}
function examDueTxt(e,s){
 const d=examDue(e,s);if(!d)return "";
 const n=daysBetween(today(),d);
 const cls=!s.done&&n<=2?"style=\"color:var(--red);font-weight:700\"":"";
 return `<small ${cls}>${s.due?"提出 ":"テストの日に提出 "}${mdOf(d)}(${WDAY[dowOf(d)]})${s.done?"":n<0?"・すぎています":n===0?"・今日":"・あと"+n+"日"}</small>`;}
RENDER.exam=function(){
 const e=examData(),par=document.body.classList.contains("parent"),el=qs("#s-exam");
 let h="";
 if(e){
  const left=examSubsLeft(e).length,over=!examActive();
  h+=`<div class="card"><h2>📝 ${esc(e.name)}${over?" <small class=\"note\">(終わったテスト)</small>":""}</h2>
   <p class="note">${e.dates.length?"テストの日:"+e.dates.map(d=>mdOf(d)+"("+WDAY[dowOf(d)]+")").join("、"):"テストの日は読めませんでした"}${e.dates.length&&!over?"　あと"+Math.max(0,daysBetween(today(),[...e.dates].sort()[0]))+"日":""}</p></div>`;
  h+=`<div class="card"><h2>✅ 提出物 <small class="note">${e.subs.length?(left?"のこり"+left+"件":"ぜんぶ終わり!"):""}</small></h2>
   ${e.subs.length?`<div class="exsubs">${e.subs.map(s=>`<div class="exsub ${s.done?"done":""}"><button class="pchk" onclick="examToggle('${s.id}')" aria-label="チェック">${s.done?"✓":""}</button>
    <div class="exsb"><b><span class="exlab">${esc(examLabel(s))}</span>${esc(s.name)}</b>${examDueTxt(e,s)}</div></div>`).join("")}</div>
    <p class="note" style="margin-top:6px">終わったら □ をタップしてチェック。もう一度タップで外せます。</p>`:`<p class="note">提出物は読めませんでした。</p>`}</div>`;
  h+=`<div class="card"><h2>📚 テスト範囲</h2>${e.subjects.length?`<div class="exrng">${e.subjects.map(x=>`<div class="exr"><span class="exlab">${esc(examLabel(x))}</span><span>${esc(x.range)}</span></div>`).join("")}</div>`:`<p class="note">範囲は読めませんでした。</p>`}</div>`;}
 else if(!par)h+=`<div class="card"><p class="note">テスト範囲はまだ入っていません。おうちの人が入れると、ここに出ます。</p></div>`;
 if(par){
  h+=`<div class="card flow"><h2>${e?"新しいテスト範囲を入れる":"テスト範囲・提出物を入れる(3ステップ)"}</h2>
   <ol class="flowl">
    <li><b>📱 範囲表を撮る</b><span>学校でもらったテスト範囲表(提出物の一覧)を、上から真っすぐ撮る。</span></li>
    <li><b>💬 Claudeに送る</b><span>プロジェクト「まなびば変換」で<b>新しいチャット</b>を開き、写真と、下のボタンでコピーした文を送る。</span></li>
    <li><b>📋 返事を貼る</b><span>Claudeの返事をコピーして下に貼り、「取り込む」を押す。</span></li>
   </ol>
   <button class="btn sub wide" onclick="copyText(examRules())">📋 Claudeに送る文をコピー</button>
   <textarea id="examPaste" class="exta" placeholder="ここにClaudeの返事を貼る"></textarea>
   <button class="btn big wide" onclick="examImport()">取り込む</button>
   ${examMsg?(examMsg.err?`<p style="color:var(--red);margin-top:6px">⚠️ ${esc(examMsg.err)}</p>`:`<p style="margin-top:6px">✅ ${esc(examMsg.ok)}</p>`):""}
   <p class="note" style="margin-top:6px">入れたものは、ホームの「📝 テスト範囲・提出物」と、カレンダーのテスト日に出ます。学校ドリルは、テストが終わるまで範囲のワークのページだけが出ます。新しく入れると前のテストと入れ替わります(同じ名前の提出物のチェックは残ります)。</p>
   ${e?`<button class="btn sub sm" style="margin-top:6px" onclick="examClear()">いまのテスト範囲を消す</button>`:""}</div>`;}
 el.innerHTML=h;};
TITLES.exam="📝 テスト範囲・提出物";

/* ---------- 起動 ---------- */
(async function boot(){
 try{
  await dbOpen();await loadAll();planInit();
  if(!D.meta.migration){
   const rep=await migrateFromThisBrowser();
   if(rep)toast("今のまなびばから引き継ぎました(デッキ"+rep.decks+"・カード"+rep.cards+"枚)");
  }
 }catch(e){
  qs("#boot").textContent="この端末では保存の仕組み(IndexedDB)が使えません:"+e.message;return;}
 qs("#boot").remove();
 show();planTimerRender();setInterval(planTick,1000);
})();
</script>
